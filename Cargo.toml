[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/filter-webgpu",
    "crates/native",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Web-FFmpeg-GPU Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/kaykaymaidou/web-ffmpeg-gpu-rust"
description = "High-performance Zero-OS-I/O media core for Web-FFmpeg: demuxers, muxers, bitstream parsers, audio DSP, and filtergraphs"
keywords = ["ffmpeg", "video", "webgpu", "webcodecs", "demuxer"]
categories = ["multimedia::video", "multimedia::audio", "encoding"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
